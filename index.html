<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OME-Zarr Video Docs</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<style>
  /* Colors after the pydata-sphinx-theme used by the NGFF docs. */
  :root {
    color-scheme: light;
    --bg: #fff; --fg: #222832; --muted: #5e6671; --card: #f3f4f5; --border: #d1d5da;
    --accent: #0a7d91; --accent-fg: #fff; --link: #0a7d91;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #14181e; --fg: #ced6dd; --muted: #9ca4af; --card: #1f252e; --border: #48566b;
      --accent: #3fb1c5; --accent-fg: #14181e; --link: #3fb1c5;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #14181e; --fg: #ced6dd; --muted: #9ca4af; --card: #1f252e; --border: #48566b;
    --accent: #3fb1c5; --accent-fg: #14181e; --link: #3fb1c5;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.65 system-ui, sans-serif; }
  header { padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; border-bottom: 1px solid var(--border); margin-bottom: 12px; }
  h1 { margin: 0; font-size: 1.4rem; font-weight: 600; color: var(--fg); }
  input[type=search] { flex: 1; min-width: 180px; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--fg); font: inherit; }
  #chips { display: flex; flex-wrap: wrap; gap: 6px; width: 100%; }
  .chip { background: var(--bg); color: var(--fg); border: 1px solid var(--border); border-radius: 99px; padding: 2px 12px; cursor: pointer; font: inherit; font-size: .85rem; }
  .chip:hover { border-color: var(--accent); }
  .chip[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  section { padding: 0 16px 16px; }
  h2 { font-size: 1.1rem; font-weight: 600; margin: 8px 0; }
  .row.grid { flex-wrap: wrap; overflow-x: visible; }
  .row { display: flex; gap: 12px; overflow-x: auto; padding: 4px 4px 8px; scroll-snap-type: x mandatory; }
  .card { flex: 0 0 220px; scroll-snap-align: start; background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 0; color: inherit; text-align: left; cursor: pointer; overflow: hidden; font: inherit; line-height: 1.4; transition: border-color .15s, box-shadow .15s; }
  .card:hover, .card:focus-visible { border-color: var(--accent); box-shadow: 0 2px 8px #0002; }
  .thumb { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: grid; place-items: center; background: var(--border); color: var(--muted); font-size: 2rem; }
  .card b { display: block; padding: 6px 8px 0; font-size: .9rem; font-weight: 600; }
  .card small { display: block; padding: 0 8px 8px; color: var(--muted); }
  dialog { width: min(960px, 100%); max-height: 100vh; background: var(--bg); color: var(--fg); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
  dialog::backdrop { background: #0009; }
  #player { aspect-ratio: 16/9; background: #000; }
  #player > * { width: 100%; height: 100%; border: 0; }
  #srcs { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; align-items: center; }
  a { color: var(--link); }
  code { background: var(--card); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; font-size: .9em; }
  .close { float: right; }
  details { position: relative; }
  summary { cursor: pointer; list-style: none; }
  summary::-webkit-details-marker { display: none; }
  details[open] summary { border-color: var(--accent); }
  #opts { position: absolute; right: 0; z-index: 1; margin-top: 6px; padding: 12px 14px; min-width: 220px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 4px 16px #0003; display: grid; gap: 10px; }
  #opts label { display: grid; gap: 2px; font-size: .8rem; color: var(--muted); }
  #opts select, #opts input { background: var(--bg); color: var(--fg); border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px; font: inherit; font-size: .9rem; }
  #opts button { justify-self: end; }
  .muted { color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>OME-Zarr Video Docs</h1>
  <input type="search" id="q" placeholder="Search videos…" aria-label="Search videos">
  <button type="button" class="chip" id="theme" aria-label="Color theme"></button>
  <details>
    <summary class="chip">⚙ Filter</summary>
    <div id="opts">
      <label>Sort <select id="sort">
        <option value="new">Newest first</option>
        <option value="old">Oldest first</option>
        <option value="title">Title A–Z</option>
      </select></label>
      <label>From <input type="date" id="from"></label>
      <label>To <input type="date" id="to"></label>
      <button type="button" class="chip" id="reset">Reset</button>
    </div>
  </details>
  <div id="chips"></div>
</header>
<main id="rows"></main>
<dialog id="dlg">
  <button class="chip close" id="close" aria-label="Close">✕</button>
  <h2 id="title"></h2>
  <div id="player"></div>
  <div id="srcs"></div>
  <p class="muted" id="meta"></p>
  <div id="desc"></div>
</dialog>
<script>
const $ = s => document.querySelector(s);
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const ytId = u => { try { const x = new URL(u); return x.hostname === 'youtu.be' ? x.pathname.slice(1) : x.searchParams.get('v'); } catch { return null; } };
const commonsFile = u => decodeURIComponent(u.split('/wiki/File:')[1] || '');
const fmtDate = d => d ? String(d) : '';

// Source keys in pick order. Each returns [{label, kind, src, page}].
const SOURCES = [
  ['zenodo', u => {
    const m = u.match(/^https:\/\/zenodo\.org\/records\/(\d+)\/files\/([^?#]+)/);
    return m ? [{ label: 'Zenodo', kind: 'video', src: `https://zenodo.org/api/records/${m[1]}/files/${m[2]}/content`, page: `https://zenodo.org/records/${m[1]}` }] : [];
  }],
  ['commons', u => [{ label: 'Commons', kind: 'video', src: `https://commons.wikimedia.org/wiki/Special:FilePath/${encodeURIComponent(commonsFile(u))}`, page: u }]],
  ['github', u => [{ label: 'GitHub', kind: 'video',
    src: u.replace(/^https:\/\/github\.com\/([^/]+\/[^/]+)\/(?:blob|raw)\//, 'https://raw.githubusercontent.com/$1/'),
    page: u.replace(/^https:\/\/raw\.githubusercontent\.com\/([^/]+\/[^/]+)\//, 'https://github.com/$1/blob/') }]],
  ['imagesc', d => [{ label: 'image.sc', kind: 'video', src: d.file, page: d.post }]],
  ['custom', list => list.map((w, i) => ({ label: `Web ${i + 1}`, kind: 'video', src: w.file, page: w.page }))],
  ['bluesky', u => [{ label: 'Bluesky', kind: 'hls', resolve: () => bsky(u).then(e => e.playlist), page: u }]],
  ['youtube', u => { const id = ytId(u); return id ? [{ label: 'YouTube', kind: 'iframe', src: `https://www.youtube-nocookie.com/embed/${id}`, page: u }] : []; }],
];
// Bluesky: post URL -> video embed ({playlist, thumbnail}) via the public API, once per post.
const BSKY = 'https://public.api.bsky.app/xrpc/';
const bskyCache = new Map();
const getJson = u => fetch(u).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
function bsky(url) {
  if (!bskyCache.has(url)) bskyCache.set(url, (async () => {
    const [, actor, rkey] = url.match(/\/profile\/([^/]+)\/post\/([^/?#]+)/);
    const did = actor.startsWith('did:') ? actor
      : (await getJson(`${BSKY}com.atproto.identity.resolveHandle?handle=${encodeURIComponent(actor)}`)).did;
    const { posts } = await getJson(`${BSKY}app.bsky.feed.getPosts?uris=${encodeURIComponent(`at://${did}/app.bsky.feed.post/${rkey}`)}`);
    const e = posts[0]?.embed;
    const video = e?.playlist ? e : e?.media; // media: video post with a quote
    if (!video?.playlist) throw new Error('no video in post');
    return video;
  })());
  return bskyCache.get(url);
}
let hlsLib; // ponytail: loaded only when a Bluesky video plays
const loadHls = () => hlsLib ||= new Promise((ok, fail) => {
  const s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js';
  s.onload = () => ok(window.Hls); s.onerror = fail;
  document.head.append(s);
});
const sourcesOf = v => SOURCES.flatMap(([k, f]) => v.sources?.[k] ? f(v.sources[k]) : []);

function thumb(v) {
  const s = v.sources || {};
  const id = s.youtube && ytId(s.youtube);
  const url = id ? `https://img.youtube.com/vi/${id}/hqdefault.jpg`
    : s.commons ? `https://commons.wikimedia.org/wiki/Special:FilePath/${encodeURIComponent(commonsFile(s.commons))}?width=320`
    : null;
  const img = document.createElement('img'); img.className = 'thumb'; img.loading = 'lazy'; img.alt = '';
  if (url) { img.src = url; return img; }
  const d = document.createElement('div'); d.className = 'thumb'; d.textContent = '▶';
  if (s.bluesky) bsky(s.bluesky).then(e => { img.src = e.thumbnail; d.replaceWith(img); }).catch(() => {});
  return d;
}

function card(v) {
  const b = document.createElement('button');
  b.className = 'card';
  const t = document.createElement('b'); t.textContent = v.title;
  const d = document.createElement('small'); d.textContent = [fmtDate(v.date), sourcesOf(v).map(s => s.label).join(', ')].filter(Boolean).join(' · ');
  b.append(thumb(v), t, d);
  b.onclick = () => { location.hash = slug(v.title); };
  return b;
}

function play(list, i) {
  const player = $('#player');
  player.replaceChildren();
  const s = list[i];
  if (!s) { player.textContent = 'No playable source.'; return; }
  const node = document.createElement(s.kind === 'iframe' ? 'iframe' : 'video');
  const next = () => { if (node.isConnected) play(list, i + 1); };
  if (node.tagName === 'VIDEO') {
    node.controls = true; node.autoplay = true; node.preload = 'metadata';
    node.onerror = next; // ponytail: auto-advance only works for <video>; iframes use the switcher
  }
  if (s.kind === 'video') node.src = s.src;
  else if (s.kind === 'hls') {
    s.resolve().then(async src => {
      if (node.canPlayType('application/vnd.apple.mpegurl')) { node.src = src; return; }
      const Hls = await loadHls();
      const hls = new Hls();
      hls.on(Hls.Events.ERROR, (_, d) => { if (d.fatal) { hls.destroy(); next(); } });
      hls.loadSource(src); hls.attachMedia(node);
      node.addEventListener('emptied', () => { if (!node.isConnected) hls.destroy(); });
    }).catch(next);
  } else {
    node.src = s.src;
    node.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
    node.allowFullscreen = true;
    node.title = 'Video player';
  }
  player.append(node);
  const srcs = $('#srcs');
  srcs.replaceChildren('Sources: ');
  list.forEach((x, j) => {
    const c = document.createElement('button');
    c.className = 'chip'; c.textContent = x.label; c.setAttribute('aria-pressed', j === i);
    c.onclick = () => play(list, j);
    srcs.append(c);
  });
  const a = document.createElement('a');
  a.href = s.page; a.target = '_blank'; a.rel = 'noopener'; a.textContent = `view on ${s.label.replace(/ \d+$/, '')} ↗`;
  srcs.append(a);
}

function openVideo(v) {
  $('#title').textContent = v.title;
  $('#meta').textContent = [fmtDate(v.date), (v.tags || []).map(t => '#' + t).join(' ')].filter(Boolean).join(' · ');
  $('#desc').innerHTML = DOMPurify.sanitize(marked.parse(v.description || ''));
  play(sourcesOf(v), 0);
  if (!$('#dlg').open) $('#dlg').showModal();
}

let catalog, active = null;

const SORTS = { // undated videos go last in both date orders
  new: (a, b) => String(b.date || '0000').localeCompare(String(a.date || '0000')),
  old: (a, b) => String(a.date || '9999').localeCompare(String(b.date || '9999')),
  title: (a, b) => a.title.localeCompare(b.title),
};

function render() {
  const q = $('#q').value.toLowerCase();
  const from = $('#from').value, to = $('#to').value;
  const vids = catalog.videos
    .filter(v => !active || (v.tags || []).includes(active))
    .filter(v => !q || [v.title, v.description, ...(v.tags || [])].join(' ').toLowerCase().includes(q))
    .filter(v => !from || (v.date && v.date >= from)) // undated videos drop out once a range is set
    .filter(v => !to || (v.date && v.date <= to))
    .sort(SORTS[$('#sort').value]);
  const sections = catalog.sections || [];
  const sectionTags = new Set(sections.map(s => s.tag));
  // A selected tag or a search shows one flat grid instead of the per-section rows.
  const flat = active || q;
  const tagLabel = active && (sections.find(s => s.tag === active)?.label || active);
  const rows = (flat ? [[q ? `${tagLabel || 'Results'} (${vids.length})` : tagLabel, vids]] : [
    ...sections.map(s => [s.label, vids.filter(v => (v.tags || []).includes(s.tag))]),
    ['More', vids.filter(v => !(v.tags || []).some(t => sectionTags.has(t)))],
  ]).filter(([, list]) => list.length);
  $('#rows').replaceChildren(...rows.map(([label, list]) => {
    const sec = document.createElement('section');
    const h = document.createElement('h2'); h.textContent = label;
    const row = document.createElement('div'); row.className = flat ? 'row grid' : 'row';
    row.append(...list.map(card));
    sec.append(h, row);
    return sec;
  }));
  if (!rows.length) $('#rows').textContent = 'No videos match.';
}

function renderChips() {
  const tags = (catalog.sections || []).map(s => s.tag); // ponytail: only section tags are pinned as chips
  $('#chips').replaceChildren(...tags.map(t => {
    const c = document.createElement('button');
    c.className = 'chip'; c.textContent = t; c.setAttribute('aria-pressed', t === active);
    c.onclick = () => { active = active === t ? null : t; renderChips(); render(); };
    return c;
  }));
}

function onHash() {
  const v = catalog.videos.find(v => slug(v.title) === location.hash.slice(1));
  if (v) openVideo(v); else if ($('#dlg').open) $('#dlg').close();
}

$('#close').onclick = () => $('#dlg').close();
$('#dlg').addEventListener('close', () => {
  $('#player').replaceChildren();
  if (location.hash) history.replaceState(null, '', location.pathname + location.search);
});
// Theme: auto (follows the system) → light → dark. Remembered per browser.
const THEMES = { auto: '◐ Auto', light: '☀ Light', dark: '☾ Dark' };
function setTheme(name) {
  if (name === 'auto') delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = name;
  $('#theme').textContent = THEMES[name];
  $('#theme').dataset.value = name;
  try { localStorage.setItem('theme', name); } catch {}
}
let savedTheme = 'auto';
try { savedTheme = localStorage.getItem('theme') || 'auto'; } catch {}
setTheme(THEMES[savedTheme] ? savedTheme : 'auto');
$('#theme').onclick = () => {
  const names = Object.keys(THEMES);
  setTheme(names[(names.indexOf($('#theme').dataset.value) + 1) % names.length]);
};
$('#reset').onclick = () => { $('#sort').value = 'new'; $('#from').value = $('#to').value = ''; render(); };
$('#q').oninput = $('#sort').onchange = $('#from').onchange = $('#to').onchange = render;
addEventListener('hashchange', onHash);

fetch('videos.yaml')
  .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(t => {
    catalog = jsyaml.load(t, { schema: jsyaml.JSON_SCHEMA }); // ponytail: JSON schema keeps dates as strings
    catalog.videos ||= [];
    renderChips(); render(); onHash();
  })
  .catch(e => { $('#rows').textContent = 'Failed to load catalog: ' + e.message; });
</script>
</body>
</html>
